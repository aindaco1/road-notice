name: FineMeNot
options:
  bundleIdPrefix: xyz.dustwave
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  FineMeNotCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.4"
    CURRENT_PROJECT_VERSION: "12"
    DEVELOPMENT_TEAM: PWT3Q52LZ2
targets:
  FineMeNot:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Data/Published/cameras.json
        buildPhase: resources
    dependencies:
      - package: FineMeNotCore
        product: CameraCore
      - package: FineMeNotCore
        product: SupportCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.dustwave.fine-me-not
        PRODUCT_NAME: FineMeNot
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Road Notice
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, audio, fetch]
        NSLocationWhenInUseUsageDescription: Road Notice uses your location to warn you before nearby speed and red-light cameras. Your location stays on your phone.
        NSLocationAlwaysAndWhenInUseUsageDescription: Allow Always so Road Notice can warn you while driving with your screen locked or another app open. Your location stays on your phone.
        NSLocationRequireExplicitServiceSession: true
        BGTaskSchedulerPermittedIdentifiers: [xyz.dustwave.fine-me-not.database-refresh]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/FineMeNot.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
  CompatibilityUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/CompatibilityUITests
      - path: Tests/Fixtures/camera-approach.json
        buildPhase: resources
    dependencies:
      - target: FineMeNot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.dustwave.fine-me-not.compatibility-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FineMeNot
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  FineMeNot:
    build:
      targets:
        FineMeNot: all
    run:
      config: Debug
    test:
      targets: [CompatibilityUITests]
    archive:
      config: Release
