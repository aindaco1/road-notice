name: iOS runtime compatibility
on:
  push:
    branches: [main]
    paths: &app_paths
      - 'App/**'
      - 'Sources/**'
      - 'Tests/CameraCoreTests/**'
      - 'Tests/SupportCoreTests/**'
      - 'Tests/CompatibilityUITests/**'
      - 'Tests/Fixtures/camera-approach.json'
      - 'Package.swift'
      - 'shared/dust-wave-platform'
      - 'platform-support.json'
      - 'project.yml'
      - 'FineMeNot.xcodeproj/**'
      - 'Scripts/check_bundle.py'
      - 'Scripts/simulator_smoke.py'
      - 'Scripts/prepare_simulator_runtime.py'
      - '.github/workflows/compatibility.yml'
  pull_request:
    paths: *app_paths
  workflow_dispatch:
    inputs:
      ios_version:
        description: Apple simulator runtime version
        required: true
        type: choice
        options: ['all', '17.5', '18.0', '18.5', '26.5']
        default: 'all'
      scenario:
        description: Auto checks background routes on 17/26 and settings/audio on 18; background on 18 is diagnostic
        required: true
        type: choice
        options: ['auto', 'background', 'foreground']
        default: 'auto'
permissions:
  contents: read
concurrency:
  group: ios-compatibility-${{ github.ref }}-${{ inputs.ios_version || 'all' }}-${{ inputs.scenario || 'auto' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build the shipped minimum once
        run: |
          xcodebuild -version
          xcodebuild -project FineMeNot.xcodeproj -scheme FineMeNot \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            -derivedDataPath build build-for-testing
          python3 Scripts/check_bundle.py build/Build/Products/Debug-iphonesimulator/FineMeNot.app --release
          tar -czf build/simulator-app.tar.gz -C build/Build Products
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-app
          path: build/simulator-app.tar.gz
          retention-days: 3
  runtime:
    needs: build
    # Legacy runtimes stall during setup on the newer host image. The app
    # artifact is unchanged; only the simulator host differs.
    runs-on: ${{ matrix.ios_version == '26.5' && 'macos-26' || 'macos-15' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ios_version: ${{ fromJSON(inputs.ios_version && inputs.ios_version != 'all' && format('["{0}"]', inputs.ios_version) || '["17.5", "18.5", "26.5"]') }}
    env:
      FMN_IOS_VERSION: ${{ matrix.ios_version }}
      # Moving GPS delivery fails even in a minimal control app on hosted iOS 18.
      # Keep that replay available for diagnosis; do not label the UI/audio gate
      # as background acceptance. See docs/TESTING.md for the local iOS 18 result.
      FMN_SCENARIO: ${{ inputs.scenario && inputs.scenario != 'auto' && inputs.scenario || startsWith(matrix.ios_version, '18.') && 'foreground' || 'background' }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare requested runtime
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"[0-9]+\.[0-9]+(?:\.[0-9]+)?", os.environ["FMN_IOS_VERSION"])'
          xcodebuild -version
          df -h /
          python3 Scripts/prepare_simulator_runtime.py "$FMN_IOS_VERSION"
      - uses: actions/download-artifact@v4
        with:
          name: compatibility-app
          path: build
      - name: Unpack the same app on every runtime
        run: |
          tar -xzf build/simulator-app.tar.gz -C build
          python3 Scripts/check_bundle.py build/Products/Debug-iphonesimulator/FineMeNot.app --release
      - name: Check selected runtime behavior
        run: |
          python3 Scripts/simulator_smoke.py "$FMN_IOS_VERSION" \
            build/Products/Debug-iphonesimulator/FineMeNot.app build/Products/*.xctestrun \
            --scenario "$FMN_SCENARIO"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-${{ matrix.ios_version }}-evidence
          path: build/compatibility/
