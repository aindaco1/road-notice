name: Build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    name: Core tests and release-minimum simulator build
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check pinned support package
        run: node shared/dust-wave-platform/scripts/check-desktop-consumer.mjs . platform-support.json
      - name: Toolchain
        run: xcodebuild -version
      - name: Publisher tests
        run: python3 -m unittest discover -s Tests/Pipeline -v
      - name: Core tests
        run: swift test
      - name: Build app with installed SDK
        run: >-
          xcodebuild -project FineMeNot.xcodeproj -scheme FineMeNot
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          -derivedDataPath build build
      - name: Verify resources and package app
        run: |
          python3 Scripts/check_bundle.py build/Build/Products/Debug-iphonesimulator/FineMeNot.app
          tar -C build/Build/Products/Debug-iphonesimulator -czf build/FineMeNot-simulator.tar.gz FineMeNot.app
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: simulator-compatibility-build
          path: build/FineMeNot-simulator.tar.gz
