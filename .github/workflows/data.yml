name: Camera database and website
on:
  schedule:
    - cron: '0 0 * * 1'
      timezone: America/Denver
  workflow_dispatch:
    inputs:
      refresh_sources:
        description: Fetch upstream camera data before publishing
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['Site/**', 'Data/**', 'App/Resources/Assets.xcassets/AppIcon.appiconset/**', 'Scripts/*.py', 'Scripts/requirements-data.txt', '.github/workflows/data.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: camera-database-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test publisher
        run: python3 -m unittest discover -s Tests/Pipeline -v
      - name: Install bounded road-data reader
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_sources)
        run: python3 -m pip install -r Scripts/requirements-data.txt
      - name: Use staged source checks or catch up if delayed
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_sources)
        run: python3 Scripts/refresh_sources.py --if-stale
      - name: Publish reviewed inputs
        run: python3 Scripts/publish_cameras.py --staged
      - name: Update maintenance findings
        run: python3 Scripts/maintenance_report.py
      - name: Save reproducible source and snapshot changes
        run: |
          git config user.name 'road-notice publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh camera database'
            git push
          fi
      - name: Stage website and immutable snapshots
        run: python3 Scripts/stage_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/site
      - name: Deploy website and database
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Keep maintenance evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: camera-maintenance-${{ github.run_id }}
          path: Data/Review/
          retention-days: 30
