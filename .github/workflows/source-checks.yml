name: Check camera sources before weekly publication
on:
  schedule:
    - cron: '0 21 * * 0'
      timezone: America/Denver
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: camera-database-publication
  cancel-in-progress: false
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate pipeline
        run: python3 -m unittest discover -s Tests/Pipeline -v
      - name: Install bounded road-data reader
        run: python3 -m pip install -r Scripts/requirements-data.txt
      - name: Query OSM, agency feeds, and watched pages
        run: python3 Scripts/refresh_sources.py
      - name: Save staged sources and review findings
        run: |
          git config user.name 'road-notice source checker'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Data/Sources Data/External Data/Watch Data/Review Data/Geocoding Data/SpeedLimits
          if ! git diff --cached --quiet; then
            git commit -m 'Check camera sources before weekly publication'
            git push
          fi
      - name: Summarize changes and failures
        if: always()
        run: cat Data/Review/maintenance.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep maintenance evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: camera-maintenance-${{ github.run_id }}
          path: Data/Review/
          retention-days: 30
